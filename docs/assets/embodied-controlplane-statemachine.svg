<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="mG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="mO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/></marker>
    <marker id="mR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a14e50"/></marker>
    <marker id="mB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="420" rx="14" fill="#f8fafc"/>
  <text x="28" y="38" font-size="18" font-weight="700" fill="#0f172a">作业状态机 · 完整迁移（03 §4，示意）</text>
  <text x="28" y="60" font-size="12.5" fill="#64748b">主干 Pending→…→Succeeded；瞬时失败回 Retrying、抢占回 Evicted、数据性失败不迁态进 DLQ；终态 Failed/TimedOut/Cancelled</text>

  <!-- 主干 -->
  <g font-size="11">
    <rect x="30" y="100" width="130" height="48" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="95" y="129" font-weight="700" fill="#1e40af" text-anchor="middle">Pending</text>
    <rect x="186" y="100" width="130" height="48" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="251" y="129" font-weight="700" fill="#1e40af" text-anchor="middle">Queued</text>
    <rect x="342" y="100" width="130" height="48" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="407" y="129" font-weight="700" fill="#1e40af" text-anchor="middle">Admitted</text>
    <rect x="498" y="100" width="130" height="48" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="563" y="129" font-weight="700" fill="#1e40af" text-anchor="middle">Starting</text>
    <rect x="654" y="100" width="130" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="719" y="129" font-weight="700" fill="#166534" text-anchor="middle">Running</text>
    <rect x="820" y="100" width="120" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="880" y="129" font-weight="700" fill="#166534" text-anchor="middle">Succeeded</text>
  </g>

  <!-- 分支状态 -->
  <g font-size="10.5">
    <rect x="560" y="200" width="130" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b"/><text x="625" y="226" font-weight="700" fill="#92400e" text-anchor="middle">Retrying</text>
    <rect x="40" y="200" width="130" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b"/><text x="105" y="226" font-weight="700" fill="#92400e" text-anchor="middle">Evicted</text>
    <rect x="820" y="200" width="120" height="44" rx="8" fill="#fee2e2" stroke="#a14e50"/><text x="880" y="226" font-weight="700" fill="#991b1b" text-anchor="middle">Failed</text>
    <rect x="820" y="266" width="120" height="44" rx="8" fill="#fee2e2" stroke="#a14e50"/><text x="880" y="292" font-weight="700" fill="#991b1b" text-anchor="middle">TimedOut</text>
    <rect x="680" y="266" width="120" height="44" rx="8" fill="#fee2e2" stroke="#a14e50"/><text x="740" y="292" font-weight="700" fill="#991b1b" text-anchor="middle">Cancelled</text>
    <rect x="350" y="200" width="170" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4,3"/><text x="435" y="222" font-size="9.5" fill="#475569" text-anchor="middle">DLQ（数据性失败）</text><text x="435" y="238" font-size="9" fill="#64748b" text-anchor="middle">不迁态 · 打标降级续跑</text>
  </g>

  <!-- 主干箭头 -->
  <line x1="160" y1="124" x2="184" y2="124" stroke="#2563eb" stroke-width="2" marker-end="url(#mG)"/>
  <line x1="316" y1="124" x2="340" y2="124" stroke="#2563eb" stroke-width="2" marker-end="url(#mG)"/>
  <line x1="472" y1="124" x2="496" y2="124" stroke="#2563eb" stroke-width="2" marker-end="url(#mG)"/>
  <line x1="628" y1="124" x2="652" y2="124" stroke="#2563eb" stroke-width="2" marker-end="url(#mG)"/>
  <line x1="784" y1="124" x2="818" y2="124" stroke="#16a34a" stroke-width="2" marker-end="url(#mB)"/>

  <!-- 迁移标签 -->
  <g font-size="8.5" fill="#64748b">
    <text x="172" y="92">静态校验过（04§5）</text>
    <text x="330" y="92">Kueue 准入（02）</text>
    <text x="486" y="92">集群 ready（01）</text>
    <text x="642" y="92">entrypoint+心跳</text>
    <text x="800" y="92">全过 Gate G2–G4</text>
  </g>

  <!-- 分支箭头 -->
  <path d="M 690 148 L 640 198" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#mO)"/>
  <text x="620" y="172" font-size="8.5" fill="#92400e">瞬时失败·预算未耗尽</text>
  <path d="M 625 244 L 660 124" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#mB)"/>
  <text x="660" y="200" font-size="8.5" fill="#166534">恢复成功·从检查点续跑</text>
  <path d="M 407 148 L 180 200" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#mO)"/>
  <text x="230" y="178" font-size="8.5" fill="#92400e">被抢占/spot 回收（02§5.2）</text>
  <path d="M 105 244 L 105 150" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#mO)"/>
  <text x="40" y="190" font-size="8.5" fill="#92400e">释放资源·保留检查点·重回 Queued</text>
  <path d="M 719 148 L 630 200" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#mG)"/>
  <text x="580" y="176" font-size="8.5" fill="#475569">数据性失败→DLQ（不迁态）</text>
  <path d="M 770 124 L 880 198" fill="none" stroke="#a14e50" stroke-width="1.5" marker-end="url(#mR)"/>
  <text x="790" y="170" font-size="8.5" fill="#a14e50">重试耗尽/结构失败</text>
  <path d="M 719 148 L 860 264" fill="none" stroke="#a14e50" stroke-width="1.5" marker-end="url(#mR)"/>
  <text x="810" y="210" font-size="8.5" fill="#a14e50">超时 activeDeadline</text>
  <path d="M 563 148 L 720 288" fill="none" stroke="#a14e50" stroke-width="1.5" marker-end="url(#mR)"/>
  <text x="560" y="260" font-size="8.5" fill="#a14e50">用户取消/级联取消（任意非终态）</text>
</svg>
