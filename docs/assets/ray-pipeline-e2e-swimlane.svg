<svg width="960" height="700" viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang SC',system-ui,sans-serif">
  <!-- 卡片底色 + 标题 -->
  <rect x="0" y="0" width="960" height="700" rx="12" fill="#f6f7f9"/>
  <text x="24" y="30" font-size="16" fill="#1f2937" font-weight="700">Ray 编排的具身数据管线端到端处理流程（泳道 = CPU / GPU 职责分域）</text>
  <text x="24" y="50" font-size="11" fill="#6b7280">底稿：调研笔记-04 五段流水线（阿里云 EMR Serverless Spark Ray 官方实践，微软 VITRA 思路）· CPU Driver 承担全部 I/O 密集阶段 · GPU Worker 只跑推理 · ray.remote(num_gpus=1) 提交 / ray.get 依赖等待</text>

  <!-- ===== 输入源 ===== -->
  <rect x="24" y="66" width="110" height="60" rx="6" fill="#e5e7eb"/>
  <text x="79" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">输入源</text>
  <rect x="146" y="66" width="790" height="60" rx="6" fill="#fff" stroke="#d1d5db"/>
  <text x="158" y="90" font-size="12.5" fill="#1f2937">第一视角视频（AR 眼镜 / 头显 / 互联网 ego 视频）· OSS 路径 oss://bucket/vitra/videos/*.mp4</text>
  <text x="158" y="110" font-size="11" fill="#6b7280">scan_input：OSS 前缀扫描（pyjindo + 节点 RAM 角色免 AK/SK；亦支持本地目录 / .txt 列表输入）</text>

  <text x="541" y="144" text-anchor="middle" font-size="14" fill="#6b7280">▼ <tspan font-size="11">视频文件</tspan></text>

  <!-- ===== Stage 0 · CPU Driver ===== -->
  <rect x="24" y="154" width="110" height="56" rx="6" fill="#dbeafe"/>
  <text x="79" y="178" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">CPU Driver</text>
  <text x="79" y="196" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">Ray 编排</text>
  <rect x="146" y="154" width="790" height="56" rx="6" fill="#fff" stroke="#bfdbfe"/>
  <rect x="146" y="154" width="4" height="56" rx="2" fill="#2563eb"/>
  <text x="162" y="176" font-size="12.5" fill="#1f2937"><tspan font-weight="700">Stage 0 · 预处理</tspan>：裁切 20s clips（相邻重叠 2s）→ 重采样 30fps → 去畸变 → JPEG 帧落盘复用</text>
  <text x="162" y="196" font-size="11" fill="#6b7280">（GPU 阶段免重复解码；长视频先提全部帧到共享目录，各 clip 用符号链接切分边界）</text>

  <text x="541" y="228" text-anchor="middle" font-size="14" fill="#6b7280">▼ <tspan font-size="11">JPEG 帧 + 时间戳 + 内参元数据</tspan></text>

  <!-- ===== Stage 1 · GPU Worker ===== -->
  <rect x="24" y="238" width="110" height="236" rx="6" fill="#d1fae5"/>
  <text x="79" y="352" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">GPU Worker</text>
  <text x="79" y="370" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">Ray 推理</text>
  <rect x="146" y="238" width="790" height="236" rx="6" fill="#fff" stroke="#a7f3d0"/>
  <rect x="146" y="238" width="4" height="236" rx="2" fill="#059669"/>
  <text x="162" y="260" font-size="12.5" fill="#1f2937"><tspan font-weight="700">Stage 1 · 三维重建</tspan>：每视频一个 @ray.remote(num_gpus=1) remote task（教程正文写 Actor，代码实为 remote function——形态辨析见主文 2.4）</text>

  <!-- 三模型卡片 -->
  <rect x="162" y="272" width="248" height="100" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="174" y="292" font-size="12" font-weight="700" fill="#047857">HaWoR ~10 GB</text>
  <text x="174" y="310" font-size="10.5" fill="#374151">YOLO 手部检测（WiLoR）→ MANO</text>
  <text x="174" y="326" font-size="10.5" fill="#374151">→ Masked DROID-SLAM</text>
  <text x="174" y="342" font-size="10.5" fill="#374151">出：腕旋转（轴角）/ 平移 /</text>
  <text x="174" y="358" font-size="10.5" fill="#374151">MANO 关节姿态 × 左右手</text>

  <rect x="418" y="272" width="248" height="100" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="430" y="292" font-size="12" font-weight="700" fill="#047857">MoGe-2 ~6 GB</text>
  <text x="430" y="310" font-size="10.5" fill="#374151">逐帧单目深度推理</text>
  <text x="430" y="326" font-size="10.5" fill="#374151">出：深度图 / 点云 / 法线 / FoV</text>

  <rect x="674" y="272" width="248" height="100" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="686" y="292" font-size="12" font-weight="700" fill="#047857">MegaSAM ~4 GB</text>
  <text x="686" y="310" font-size="10.5" fill="#374151">Depth-Anything 视差 → 深度格式</text>
  <text x="686" y="326" font-size="10.5" fill="#374151">转换 → DROID-SLAM 相机追踪</text>
  <text x="686" y="342" font-size="10.5" fill="#374151">出：camera_to_world[T,4,4]</text>
  <text x="686" y="358" font-size="10.5" fill="#6b7280">（内参：GeoCalib 焦距估计）</text>

  <text x="162" y="396" font-size="11" fill="#4b5563"><tspan fill="#b91c1c" font-weight="700">强串行</tspan>：相机位姿 ← 深度先验（深度未出不跑轨迹求解）｜<tspan fill="#b45309" font-weight="700">回注红线</tspan>：camera_to_world 仅 CPU 后处理坐标变换、不回灌模型优化（防闭环误差放大）</text>
  <text x="162" y="414" font-size="11" fill="#4b5563">EMR 形态：三模型同进程串行加载、加载下一个前 del + empty_cache（合计 ~20 GB 挤进单张 16 GB 卡；代价：三阶段无法流水线并行——吞吐换显存）</text>
  <text x="162" y="432" font-size="11" fill="#4b5563">自研形态：Actor 池权重常驻 + 单分片依赖 DAG 调度（见 2.5.2 图 B）——同一套 Ray API 下的部署选择，形态随规模演进不换技术栈</text>

  <text x="541" y="492" text-anchor="middle" font-size="11" fill="#6b7280">▼ MotionLabel3D：腕位置 / 旋转（轴角）/ 关节姿态 + camera_poses[T,4,4] + camera_fov + valid 掩码（双手补齐到 T 帧，缺失填零标 valid=False）</text>

  <!-- ===== Stage 2/3 · CPU Driver ===== -->
  <rect x="24" y="502" width="110" height="84" rx="6" fill="#dbeafe"/>
  <text x="79" y="538" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">CPU Driver</text>
  <text x="79" y="556" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">Ray 编排</text>
  <rect x="146" y="502" width="790" height="84" rx="6" fill="#fff" stroke="#bfdbfe"/>
  <rect x="146" y="502" width="4" height="84" rx="2" fill="#2563eb"/>
  <text x="162" y="524" font-size="12.5" fill="#1f2937"><tspan font-weight="700">Stage 2 · 动作分割</tspan>：双腕速度 max(left, right) → 300ms 平滑 → find_peaks 负向极小值（最小间距 0.5s · 显著度 5%·max）</text>
  <text x="162" y="546" font-size="12.5" fill="#1f2937"><tspan font-weight="700">Stage 3 · 写出 LeRobotDataset v3.0</tspan>：meta/（info · stats · tasks · episodes）+ data/ 帧级 Parquet + videos/ H.264 MP4 1280×720@30fps</text>
  <text x="162" y="568" font-size="11" fill="#6b7280">（state 108 维 = wrist_pos + wrist_rot_6d + MANO 关节 × 左右手，rot_aa → rot_6d 转换在写出侧完成；action = 下一帧 state）</text>

  <text x="541" y="606" text-anchor="middle" font-size="14" fill="#6b7280">▼</text>

  <!-- ===== 输出 ===== -->
  <rect x="24" y="612" width="110" height="64" rx="6" fill="#e5e7eb"/>
  <text x="79" y="648" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">输出</text>
  <rect x="146" y="612" width="790" height="64" rx="6" fill="#fff" stroke="#d1d5db"/>
  <text x="162" y="636" font-size="12.5" fill="#1f2937">LeRobotDataset v3.0 → VLA 训练（ACT / Diffusion Policy / VLA）｜ Golden Set 回归 → 周期 RayJob · 训练监控 → 常驻轻服务</text>
  <text x="162" y="660" font-size="11.5" fill="#b91c1c">Badcase 回流：质检拦截样本 → 对象存储 + 队列 → 分片级重跑 → 复检（不重跑全量）</text>
</svg>
