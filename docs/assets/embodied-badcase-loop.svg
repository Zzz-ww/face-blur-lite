<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="bG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="bR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="bB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="bO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" rx="14" fill="#f8fafc"/>
  <text x="28" y="38" font-size="18" font-weight="700" fill="#0f172a">Badcase 回流闭环 · 发现到关闭（示意）</text>
  <text x="28" y="60" font-size="12.5" fill="#64748b">五发现源 → 打标分类 → 血缘定位 → 消费→治理契约 → 生产/接入修复（G0–G6）→ 双重复核关闭 → 沉淀防倒退考题</text>

  <!-- 左：发现源 -->
  <rect x="24" y="96" width="210" height="210" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="129" y="120" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">五类发现源</text>
  <g font-size="10.5">
    <text x="40" y="146" fill="#475569">· L4 评测失败（本域 02，最大源）</text>
    <text x="40" y="166" fill="#475569">· L1 抽检（治理 04 / 模型卡）</text>
    <text x="40" y="186" fill="#475569">· 人工标注复核（标注体系）</text>
    <text x="40" y="206" fill="#475569">· 训练损失异常（模型平台反馈）</text>
    <text x="40" y="226" fill="#475569">· 线上/现场反馈</text>
  </g>
  <rect x="40" y="244" width="178" height="48" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="129" y="264" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">统一接入器</text>
  <text x="129" y="282" font-size="9.5" fill="#64748b" text-anchor="middle">无样本引用 = 不可回流</text>

  <!-- 中上：打标分类 -->
  <rect x="270" y="96" width="210" height="120" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="375" y="120" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">打标分类</text>
  <g font-size="10.5">
    <text x="286" y="144" fill="#475569">缺陷类型 / 严重度 / 疑似算子</text>
    <text x="286" y="164" fill="#475569">（初判 · 治理域裁决）</text>
  </g>
  <rect x="286" y="176" width="178" height="30" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="375" y="196" font-size="10" fill="#92400e" text-anchor="middle">决策树：数据/模型/标注问题</text>

  <!-- 中下：血缘定位 -->
  <rect x="270" y="232" width="210" height="120" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="375" y="256" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">血缘定位（治理 02 §4）</text>
  <g font-size="10.5">
    <text x="286" y="282" fill="#475569">正向溯源：三锁</text>
    <text x="286" y="300" fill="#475569">（数据/算子/模型版本）</text>
    <text x="286" y="322" fill="#475569">反向 blast radius：影响面</text>
    <text x="286" y="340" fill="#991b1b" font-weight="700">无定位不回流</text>
  </g>

  <!-- 右：治理 -->
  <rect x="516" y="96" width="200" height="256" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="616" y="120" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="middle">治理域</text>
  <rect x="532" y="136" width="168" height="56" rx="6" fill="#dbeafe"/>
  <text x="616" y="158" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">消费→治理契约</text>
  <text x="616" y="178" font-size="10" fill="#1e3a8a" text-anchor="middle">准入：回流标记 + 血缘定位</text>
  <text x="616" y="210" font-size="11" fill="#1e3a8a" text-anchor="middle">缺陷定级 / 工单</text>
  <text x="616" y="230" font-size="11" fill="#1e3a8a" text-anchor="middle">回流任务下发</text>
  <text x="616" y="250" font-size="11" fill="#1e3a8a" text-anchor="middle">（缺陷分类 + 目标算子）</text>
  <text x="616" y="282" font-size="10" fill="#64748b" text-anchor="middle">修复版本走门禁晋升</text>
  <text x="616" y="302" font-size="10" fill="#64748b" text-anchor="middle">（治理 03，G0–G6 全程）</text>
  <text x="616" y="334" font-size="10" fill="#64748b" text-anchor="middle">回归判定与基线（治理 05）</text>

  <!-- 右：生产/接入 -->
  <rect x="748" y="96" width="188" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="842" y="120" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">生产/接入域</text>
  <g font-size="10.5" text-anchor="middle">
    <text x="842" y="148" fill="#166534" font-weight="700">回流样本 = 新数据</text>
    <text x="842" y="170" fill="#475569">数据问题 → 补采（接入域）</text>
    <text x="842" y="190" fill="#475569">模型问题 → 算子升级（生产域）</text>
    <text x="842" y="210" fill="#475569">标注问题 → 重标注</text>
    <text x="842" y="232" fill="#166534" font-weight="700">badcase 修复算子 + G0–G6 复检</text>
  </g>

  <!-- 下：回归验证 -->
  <rect x="270" y="392" width="666" height="56" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="603" y="414" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">双重复核（修完才算完）</text>
  <text x="603" y="436" font-size="10.5" fill="#475569" text-anchor="middle">① Golden Set 回归无倒退（治理 05）· ② 原 badcase 用例复测通过 → 才关闭</text>
  <text x="603" y="452" font-size="9.5" fill="#94a3b8" text-anchor="middle">关闭的 badcase 沉淀为防倒退考题（受控扩充 · 修过的题不当新考题）</text>

  <!-- 箭头 -->
  <line x1="234" y1="180" x2="268" y2="180" stroke="#f59e0b" stroke-width="2" marker-end="url(#bG)"/>
  <line x1="375" y1="216" x2="375" y2="230" stroke="#f59e0b" stroke-width="2" marker-end="url(#bO)"/>
  <line x1="480" y1="292" x2="530" y2="292" stroke="#dc2626" stroke-width="2" marker-end="url(#bR)"/>
  <line x1="716" y1="180" x2="746" y2="180" stroke="#2563eb" stroke-width="2" marker-end="url(#bG)"/>
  <line x1="842" y1="246" x2="842" y2="356" stroke="#16a34a" stroke-width="2" marker-end="url(#bB)"/>
  <line x1="842" y1="356" x2="603" y2="390" stroke="#16a34a" stroke-width="2" marker-end="url(#bB)"/>
  <line x1="603" y1="392" x2="603" y2="376" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#bB)"/>
  <text x="560" y="370" font-size="9.5" fill="#166534">修复版本就位通知</text>

  <!-- 回环 -->
  <path d="M 129 306 L 129 470 L 268 470" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#bG)"/>
  <text x="135" y="470" font-size="9.5" fill="#64748b">闭环：新数据再进生产</text>
</svg>
