<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="tG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="tR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="tC" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" rx="14" fill="#f8fafc"/>
  <text x="28" y="38" font-size="18" font-weight="700" fill="#0f172a">TrainingRelease 装配 · 门禁 · 供数流程（示意）</text>
  <text x="28" y="60" font-size="12.5" fill="#64748b">只从 Published 快照装配 → 按 split 组织 → 准入校验（split 隔离 + 防泄漏）→ 出证书 → 供数 / 白名单导出；不过闸整体不导出</text>

  <!-- 左：DatasetVersion -->
  <rect x="24" y="180" width="140" height="130" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="94" y="212" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="middle">DatasetVersion</text>
  <text x="94" y="236" font-size="11" fill="#334155" text-anchor="middle">Published · 快照在</text>
  <text x="94" y="256" font-size="11" fill="#334155" text-anchor="middle">ego-daily@v3.1.0</text>
  <text x="94" y="282" font-size="10.5" fill="#64748b" text-anchor="middle">精确版本 · 禁浮动</text>

  <!-- 中：装配器 -->
  <rect x="200" y="100" width="250" height="300" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="325" y="124" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">装配器（资产域）</text>

  <rect x="216" y="138" width="218" height="36" rx="6" fill="#eff6ff"/>
  <text x="228" y="160" font-size="11.5" fill="#1e3a8a">① 取数（仅只读快照，禁中间态）</text>

  <rect x="216" y="182" width="218" height="36" rx="6" fill="#eff6ff"/>
  <text x="228" y="204" font-size="11.5" fill="#1e3a8a">② 按 split 组织（不混不拼）</text>

  <!-- 校验菱形 -->
  <polygon points="325,228 420,268 325,308 230,268" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="325" y="260" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">③ 准入校验</text>
  <text x="325" y="278" font-size="10" fill="#92400e" text-anchor="middle">split 隔离 + 防泄漏</text>
  <text x="325" y="292" font-size="9" fill="#a16207" text-anchor="middle">算子-07 §4</text>

  <rect x="216" y="318" width="218" height="36" rx="6" fill="#eff6ff"/>
  <text x="228" y="340" font-size="11.5" fill="#1e3a8a">④ 生成 manifest + 拍样本快照</text>
  <text x="228" y="378" font-size="10" fill="#94a3b8">回写 consumed_by 血缘</text>

  <!-- 失败分支 -->
  <rect x="200" y="420" width="250" height="44" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="325" y="440" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">校验不过 → 整体拒绝导出 + 告警</text>
  <text x="325" y="457" font-size="10.5" fill="#b91c1c" text-anchor="middle">不产半成品 · 装配层无豁免</text>
  <line x1="325" y1="308" x2="325" y2="418" stroke="#dc2626" stroke-width="2" marker-end="url(#tR)"/>

  <!-- 右：TrainingRelease -->
  <rect x="486" y="100" width="180" height="300" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="576" y="124" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">TrainingRelease</text>
  <text x="576" y="140" font-size="10" fill="#64748b" text-anchor="middle">指针 + 清单 + 证书</text>

  <rect x="502" y="150" width="148" height="48" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="576" y="170" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">train</text>
  <text x="576" y="188" font-size="10" fill="#475569" text-anchor="middle">常规供数</text>

  <rect x="502" y="204" width="148" height="42" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="576" y="224" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">val</text>
  <text x="576" y="240" font-size="10" fill="#475569" text-anchor="middle">调参</text>

  <rect x="502" y="250" width="148" height="48" rx="6" fill="#fff7ed" stroke="#fb923c"/>
  <text x="576" y="270" font-size="11.5" font-weight="700" fill="#c2410c" text-anchor="middle">test</text>
  <text x="576" y="288" font-size="10" fill="#9a3412" text-anchor="middle">白名单 only</text>

  <rect x="502" y="302" width="148" height="48" rx="6" fill="#faf5ff" stroke="#c084fc"/>
  <text x="576" y="322" font-size="11.5" font-weight="700" fill="#7e22ce" text-anchor="middle">golden</text>
  <text x="576" y="340" font-size="10" fill="#6b21a8" text-anchor="middle">回归口粮</text>

  <text x="576" y="376" font-size="10" fill="#94a3b8" text-anchor="middle">配额统计 · hash 校验</text>

  <!-- 最右：供数通道 → 消费域 -->
  <rect x="700" y="150" width="236" height="120" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="818" y="176" font-size="12.5" font-weight="700" fill="#075985" text-anchor="middle">供数通道</text>
  <text x="818" y="200" font-size="11" fill="#0c4a6e" text-anchor="middle">预取本地化 · 流式加载</text>
  <text x="818" y="220" font-size="11" fill="#0c4a6e" text-anchor="middle">缓存预热 · 逐块 hash</text>
  <text x="818" y="244" font-size="10.5" fill="#0369a1" text-anchor="middle">数据就绪纳入调度就绪（不让 GPU 等 IO）</text>

  <!-- 右下：白名单导出/审计 -->
  <rect x="700" y="300" width="236" height="100" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="818" y="326" font-size="12.5" font-weight="700" fill="#6b21a8" text-anchor="middle">test/hold-out 白名单导出</text>
  <text x="818" y="350" font-size="11" fill="#6b21a8" text-anchor="middle">最小授权 · 每次出域审计</text>
  <text x="818" y="372" font-size="10.5" fill="#7c3aed" text-anchor="middle">导出记录回写（谁/何时/依据）</text>

  <!-- 箭头连接 -->
  <line x1="164" y1="245" x2="198" y2="245" stroke="#2563eb" stroke-width="2" marker-end="url(#tG)"/>
  <line x1="450" y1="250" x2="484" y2="250" stroke="#16a34a" stroke-width="2" marker-end="url(#tC)"/>
  <line x1="666" y1="210" x2="698" y2="210" stroke="#0284c7" stroke-width="2" marker-end="url(#tG)"/>
  <line x1="666" y1="330" x2="698" y2="330" stroke="#9333ea" stroke-width="2" marker-end="url(#tG)"/>

  <!-- 消费域终点 -->
  <text x="818" y="430" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">→ 06-消费域（加载 / 训练 / 评测）</text>
</svg>
