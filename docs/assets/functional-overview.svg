<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 592" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M0,0 L8,0 L4,7 Z" fill="#475569"/>
    </marker>
    <marker id="arrp" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M0,0 L8,0 L4,7 Z" fill="#9333ea"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1020" height="592" fill="#f8fafc"/>

  <!-- 标题 -->
  <text x="430" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">face-blur-lite · 功能图示</text>

  <!-- 输入 -->
  <rect x="335" y="66" width="190" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="430" y="85" text-anchor="middle" font-size="14" fill="#334155">输入视频</text>
  <text x="430" y="102" text-anchor="middle" font-size="12" fill="#94a3b8">5 分钟 · 任意长</text>
  <text x="430" y="128" text-anchor="middle" font-size="16" fill="#94a3b8">↓</text>

  <!-- 入口 -->
  <rect x="315" y="138" width="230" height="46" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="430" y="157" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">统一入口 blur.sh</text>
  <text x="430" y="174" text-anchor="middle" font-size="12" fill="#9a6b45">单机直达 · 托管批量 · 独立节点</text>
  <text x="430" y="198" text-anchor="middle" font-size="13" fill="#64748b">↓ 提交批次（视频 + 切片任务集）</text>

  <!-- 控制面条 -->
  <rect x="20" y="210" width="820" height="96" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="36" y="231" text-anchor="start" font-size="13" font-weight="700" fill="#1e40af">控制面 · 协调层（单一事实源）</text>
  <rect x="36" y="242" width="180" height="52" rx="6" fill="#ffffff"/>
  <text x="126" y="263" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">编排器</text>
  <text x="126" y="281" text-anchor="middle" font-size="12" fill="#64748b">提交→巡检回收→终审</text>
  <text x="228" y="272" text-anchor="middle" font-size="15" fill="#2563eb">→</text>
  <rect x="240" y="242" width="180" height="52" rx="6" fill="#ffffff"/>
  <text x="330" y="263" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">协调契约</text>
  <text x="330" y="281" text-anchor="middle" font-size="12" fill="#64748b">互斥 · 租约 · 围栏 · 恰好一次</text>
  <text x="432" y="272" text-anchor="middle" font-size="15" fill="#2563eb">→</text>
  <rect x="444" y="242" width="180" height="52" rx="6" fill="#ffffff"/>
  <text x="534" y="263" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">双实现</text>
  <text x="534" y="281" text-anchor="middle" font-size="12" fill="#64748b">SQLite 内嵌 / Go 服务</text>
  <text x="636" y="272" text-anchor="middle" font-size="15" fill="#2563eb">→</text>
  <rect x="648" y="242" width="166" height="52" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text x="731" y="263" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">状态库</text>
  <text x="731" y="281" text-anchor="middle" font-size="12" fill="#64748b">videos · chunks 两级状态机</text>

  <!-- 观测旁路（侧边，直读状态库） -->
  <line x1="816" y1="268" x2="846" y2="268" stroke="#9333ea" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrp)"/>
  <rect x="850" y="238" width="155" height="60" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="927" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#581c87">观测 · 只读旁路</text>
  <text x="927" y="275" text-anchor="middle" font-size="12" fill="#581c87">stats / progress</text>
  <text x="927" y="291" text-anchor="middle" font-size="12" fill="#581c87">不侵入契约</text>

  <!-- 控制面 ↔ 数据面 交互 -->
  <line x1="100" y1="310" x2="100" y2="352" stroke="#475569" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <line x1="760" y1="352" x2="760" y2="310" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="165" y="319" width="230" height="26" rx="13" fill="#f1f5f9"/>
  <text x="280" y="336" text-anchor="middle" font-size="13" fill="#475569">⇣ 派生执行单元池（虚线）</text>
  <rect x="465" y="319" width="230" height="26" rx="13" fill="#f1f5f9"/>
  <text x="580" y="336" text-anchor="middle" font-size="13" fill="#475569">⇡ 认领 · 回写 · 合并权（实线）</text>

  <!-- 数据面条 -->
  <rect x="20" y="358" width="820" height="96" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="36" y="379" text-anchor="start" font-size="13" font-weight="700" fill="#166534">数据面 · 执行层（无状态 · 可任意扩缩）</text>
  <rect x="70" y="390" width="210" height="52" rx="6" fill="#ffffff"/>
  <text x="175" y="411" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">执行单元 × N</text>
  <text x="175" y="429" text-anchor="middle" font-size="12" fill="#64748b">认领 → 处理 → 回写</text>
  <text x="300" y="420" text-anchor="middle" font-size="15" fill="#16a34a">→</text>
  <rect x="325" y="390" width="210" height="52" rx="6" fill="#ffffff"/>
  <text x="430" y="411" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">纯函数算子链</text>
  <text x="430" y="429" text-anchor="middle" font-size="12" fill="#64748b">split → blur → merge → qc</text>
  <text x="555" y="420" text-anchor="middle" font-size="15" fill="#16a34a">→</text>
  <rect x="580" y="390" width="210" height="52" rx="6" fill="#ffffff"/>
  <text x="685" y="411" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">流式底座</text>
  <text x="685" y="429" text-anchor="middle" font-size="12" fill="#64748b">ffmpeg pipe · 内存 O(1)</text>
  <text x="430" y="471" text-anchor="middle" font-size="13" fill="#64748b">↓ 成品输出</text>

  <!-- 输出域 -->
  <rect x="220" y="482" width="200" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="503" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">成品 outdir/</text>
  <text x="320" y="521" text-anchor="middle" font-size="12" fill="#64748b">qc 通过即转正</text>
  <rect x="440" y="482" width="200" height="48" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="540" y="503" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">qc_failed/ 隔离</text>
  <text x="540" y="521" text-anchor="middle" font-size="12" fill="#64748b">人工复核后转正</text>

  <!-- 图例 -->
  <line x1="240" y1="566" x2="262" y2="566" stroke="#475569" stroke-width="2"/>
  <text x="268" y="570" text-anchor="start" font-size="12" fill="#64748b">实线 = 调用 / 数据流</text>
  <line x1="428" y1="566" x2="450" y2="566" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="456" y="570" text-anchor="start" font-size="12" fill="#64748b">虚线 = 派生 / 只读旁路</text>
</svg>
