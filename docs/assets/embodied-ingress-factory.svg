<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="fG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="fO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/></marker>
    <marker id="fB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" rx="14" fill="#f8fafc"/>
  <text x="28" y="38" font-size="18" font-weight="700" fill="#0f172a">采集工厂排产 · 产能侧（示意）</text>
  <text x="28" y="60" font-size="12.5" fill="#64748b">三类采集需求 → 编排器（场景×设备×时间）→ 采集计划 → Agent 执行 → RawDataPackage 落湖 → 管线消费；排产不越界算力侧</text>

  <!-- 左：需求三来源 -->
  <rect x="24" y="110" width="210" height="220" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="129" y="136" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">采集需求（三类来源）</text>
  <rect x="40" y="150" width="178" height="44" rx="6" fill="#f1f5f9"/>
  <text x="129" y="170" font-size="10.5" fill="#475569" text-anchor="middle">① 场景覆盖计划（数据策略）</text>
  <text x="129" y="186" font-size="10" fill="#64748b" text-anchor="middle">覆盖目标 × 场景脚本库</text>
  <rect x="40" y="202" width="178" height="44" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="129" y="222" font-size="10.5" font-weight="700" fill="#991b1b" text-anchor="middle">② 回流补采指令（优先）</text>
  <text x="129" y="238" font-size="10" fill="#991b1b" text-anchor="middle">治理裁决 · 本域执行</text>
  <rect x="40" y="254" width="178" height="44" rx="6" fill="#f1f5f9"/>
  <text x="129" y="274" font-size="10.5" fill="#475569" text-anchor="middle">③ 专项需求</text>
  <text x="129" y="290" font-size="10" fill="#64748b" text-anchor="middle">项目 / 评测定向采集</text>
  <text x="129" y="318" font-size="10" fill="#64748b" text-anchor="middle">补采优先 · 不自行加塞降级</text>

  <!-- 中：编排 + 计划 -->
  <rect x="270" y="110" width="310" height="220" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="425" y="136" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">采集任务编排器</text>
  <text x="425" y="160" font-size="11" fill="#92400e" text-anchor="middle">任务 = 场景脚本 × 设备 × 时间段</text>
  <text x="425" y="180" font-size="10.5" fill="#475569" text-anchor="middle">设备按登记能力路由（厨房长程→人形）</text>
  <text x="425" y="200" font-size="10.5" fill="#475569" text-anchor="middle">批次（排产单位）→ session（原始包单位）</text>
  <rect x="286" y="214" width="278" height="44" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="425" y="234" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">排产器：目标 + 约束</text>
  <text x="425" y="252" font-size="9.5" fill="#92400e" text-anchor="middle">目标：利用率/覆盖/补采优先</text>
  <text x="425" y="266" font-size="9.5" fill="#92400e" text-anchor="middle">约束：维护/标定/切换成本/班次</text>
  <text x="425" y="308" font-size="10" fill="#64748b" text-anchor="middle">设备健康不达标不排产（标定过期停产）</text>

  <!-- 右：执行 + 落湖 -->
  <rect x="616" y="110" width="320" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="776" y="136" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">采集 Agent（边缘执行）</text>
  <text x="776" y="160" font-size="10.5" fill="#475569" text-anchor="middle">现场采集（适配/三查/上云 = 本域 02/03）</text>
  <text x="776" y="180" font-size="10.5" fill="#475569" text-anchor="middle">边缘缓存断网续传 · 现场不断采</text>
  <text x="776" y="204" font-size="10" fill="#64748b" text-anchor="middle">批次 outcome 必带去向（产出/拦截/原因）</text>

  <rect x="616" y="246" width="320" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="776" y="270" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">RawDataPackage 落湖（资产域 01）</text>
  <text x="776" y="290" font-size="10" fill="#166534" text-anchor="middle">登记目录 · 触发管线消费</text>

  <!-- 下：算力侧 -->
  <rect x="616" y="330" width="320" height="72" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="776" y="354" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">管线调度（管控域 · 算力侧）</text>
  <text x="776" y="376" font-size="10.5" fill="#1e3a8a" text-anchor="middle">GPU 队列 / RayJob / DAG</text>
  <text x="776" y="394" font-size="9.5" fill="#64748b" text-anchor="middle">读湖不读现场 · 互不接管</text>

  <!-- 箭头 -->
  <line x1="234" y1="220" x2="268" y2="220" stroke="#f59e0b" stroke-width="2" marker-end="url(#fG)"/>
  <line x1="580" y1="180" x2="614" y2="180" stroke="#16a34a" stroke-width="2" marker-end="url(#fG)"/>
  <line x1="776" y1="230" x2="776" y2="244" stroke="#16a34a" stroke-width="2" marker-end="url(#fB)"/>
  <line x1="776" y1="302" x2="776" y2="328" stroke="#2563eb" stroke-width="2" marker-end="url(#fG)"/>

  <!-- 反馈 -->
  <path d="M 776 402 L 776 428 L 425 428 L 425 334" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#fO)"/>
  <text x="600" y="420" font-size="9.5" fill="#64748b">产能/拦截反馈 → 排产模型（缺口如实上报）</text>
</svg>
