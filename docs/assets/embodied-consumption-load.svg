<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="cG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="cB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="cR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="cO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" rx="14" fill="#f8fafc"/>
  <text x="28" y="38" font-size="18" font-weight="700" fill="#0f172a">训练消费 · 数据流与边界（示意）</text>
  <text x="28" y="60" font-size="12.5" fill="#64748b">消费侧只认 TrainingRelease：取数 → hash 校验 → 数据就绪入调度 → 训练（模型平台）→ consumed_by 回写；消费域不碰湖仓</text>

  <!-- 左：资产域产出 -->
  <rect x="24" y="120" width="180" height="170" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="114" y="148" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">资产域</text>
  <rect x="38" y="160" width="152" height="52" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="114" y="182" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">TrainingRelease</text>
  <text x="114" y="200" font-size="10.5" fill="#475569" text-anchor="middle">指针 + 清单 + 证书</text>
  <text x="114" y="236" font-size="11" fill="#166534" text-anchor="middle">已过准入校验（05）</text>
  <text x="114" y="256" font-size="11" fill="#166534" text-anchor="middle">样本快照已拍（03）</text>
  <text x="114" y="276" font-size="10.5" fill="#64748b" text-anchor="middle">预热联动（04 加速层）</text>

  <!-- 中：消费侧加载 -->
  <rect x="240" y="84" width="280" height="280" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="108" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">消费侧加载框架（本域）</text>

  <rect x="256" y="122" width="248" height="42" rx="6" fill="#eff6ff"/>
  <text x="270" y="142" font-size="11.5" fill="#1e3a8a">① 取数：按 file_manifest_ref 拉取</text>
  <text x="270" y="158" font-size="10" fill="#64748b">只认 release · 不碰湖仓</text>

  <rect x="256" y="172" width="248" height="42" rx="6" fill="#eff6ff"/>
  <text x="270" y="192" font-size="11.5" fill="#1e3a8a">② 校验：逐块 hash 对账</text>
  <text x="270" y="208" font-size="10" fill="#64748b">到训练节点的是被证明过的字节</text>

  <rect x="256" y="222" width="248" height="42" rx="6" fill="#eff6ff"/>
  <text x="270" y="242" font-size="11.5" fill="#1e3a8a">③ 就绪：数据就绪率 100%</text>
  <text x="270" y="258" font-size="10" fill="#64748b">gang 就绪含数据就绪（管控 02）</text>

  <rect x="256" y="272" width="248" height="42" rx="6" fill="#eff6ff"/>
  <text x="270" y="292" font-size="11.5" fill="#1e3a8a">④ 重放：样本快照精确取样本</text>
  <text x="270" y="308" font-size="10" fill="#64748b">确定性栈逐位一致 · 否则统计一致</text>

  <text x="380" y="342" font-size="10.5" fill="#64748b" text-anchor="middle">版本精确引用 dataset_version@release_id</text>

  <!-- 右：模型平台 -->
  <rect x="556" y="120" width="200" height="170" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="656" y="148" font-size="13" font-weight="700" fill="#c2410c" text-anchor="middle">模型平台（边界外）</text>
  <rect x="570" y="160" width="172" height="88" rx="8" fill="#fffbeb" stroke="#fdba74"/>
  <text x="656" y="184" font-size="11.5" font-weight="700" fill="#9a3412" text-anchor="middle">Ray Train / Tune</text>
  <text x="656" y="204" font-size="10.5" fill="#9a3412" text-anchor="middle">训练循环 · 模型权重</text>
  <text x="656" y="222" font-size="10.5" fill="#9a3412" text-anchor="middle">分布式训练内部逻辑</text>
  <text x="656" y="244" font-size="10" fill="#c2410c" text-anchor="middle">（平台不管 · 边界制品）</text>
  <text x="656" y="276" font-size="10.5" fill="#9a3412" text-anchor="middle">不碰湖仓 · 只吃 TrainingRelease</text>

  <!-- 右下：回写 -->
  <rect x="556" y="320" width="200" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="656" y="340" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">consumed_by 回写血缘</text>
  <text x="656" y="357" font-size="10" fill="#166534" text-anchor="middle">哪个 release / split / 样本量（治理 02）</text>

  <!-- 箭头 -->
  <line x1="204" y1="205" x2="238" y2="205" stroke="#16a34a" stroke-width="2" marker-end="url(#cG)"/>
  <line x1="520" y1="205" x2="554" y2="205" stroke="#f59e0b" stroke-width="2" marker-end="url(#cO)"/>
  <line x1="656" y1="290" x2="656" y2="318" stroke="#16a34a" stroke-width="2" marker-end="url(#cB)"/>

  <!-- 下方：下游 -->
  <rect x="240" y="384" width="516" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="498" y="404" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">下游：02-L4 评测取数（test/hold-out 白名单）· 03-Badcase 回流</text>
  <text x="498" y="422" font-size="10.5" fill="#64748b" text-anchor="middle">评测/回流消费同一契约：版本精确 · 隔离不破</text>
  <line x1="380" y1="364" x2="380" y2="382" stroke="#2563eb" stroke-width="2" marker-end="url(#cG)"/>
</svg>
