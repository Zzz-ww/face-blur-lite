<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" rx="14" fill="#f8fafc"/>
  <text x="28" y="38" font-size="18" font-weight="700" fill="#0f172a">资产域 · 统一湖仓存储栈与多模态布局（示意）</text>
  <text x="28" y="60" font-size="12.5" fill="#64748b">一份数据 · 多种视图：数据面在左、元数据面在右，靠内容指纹 hash 关联；规则/状态在治理域，物理存储在资产域</text>

  <!-- ========== 数据面：统一湖仓 ========== -->
  <rect x="28" y="82" width="572" height="406" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="104" font-size="13" font-weight="700" fill="#334155">数据面 · 统一湖仓 Lakehouse</text>

  <!-- ④ 加速层 -->
  <rect x="44" y="116" width="540" height="50" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="58" y="138" font-size="13" font-weight="700" fill="#92400e">④ 加速层 · 训练供数</text>
  <text x="58" y="157" font-size="11.5" fill="#78350f">本地 NVMe 缓存 / 训练热点预热 / 流式加载（与消费域衔接）</text>

  <!-- ③ 开放表格式 -->
  <rect x="44" y="174" width="540" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="197" font-size="13" font-weight="700" fill="#1e40af">③ 开放表格式（Iceberg / Hudi / Delta · 选型以实现为准）</text>
  <text x="58" y="217" font-size="11.5" fill="#1e3a8a">schema 演进 · 分区 · 表级快照 · ACID · 时间旅行</text>

  <!-- ② 多模态文件层 -->
  <rect x="44" y="240" width="540" height="126" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="58" y="262" font-size="13" font-weight="700" fill="#166534">② 多模态文件（按介质特性选格式）</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="56" y="272" width="100" height="82" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="106" y="306" font-weight="700" fill="#166534">MP4</text>
    <text x="106" y="326" fill="#475569">视频大文件</text>
    <text x="106" y="342" fill="#94a3b8">顺序读</text>

    <rect x="164" y="272" width="100" height="82" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="214" y="306" font-weight="700" fill="#166534">Parquet</text>
    <text x="214" y="326" fill="#475569">状态/轨迹</text>
    <text x="214" y="342" fill="#94a3b8">列存扫描</text>

    <rect x="272" y="272" width="100" height="82" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="322" y="306" font-weight="700" fill="#166534">JSON</text>
    <text x="322" y="326" fill="#475569">元数据/清单</text>
    <text x="322" y="342" fill="#94a3b8">自描述</text>

    <rect x="380" y="272" width="100" height="82" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="430" y="306" font-weight="700" fill="#166534">PNG·NPZ</text>
    <text x="430" y="326" fill="#475569">深度/点云</text>
    <text x="430" y="342" fill="#94a3b8">无损</text>

    <rect x="488" y="272" width="80" height="82" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="528" y="306" font-weight="700" fill="#166534">向量</text>
    <text x="528" y="326" fill="#475569">embedding</text>
    <text x="528" y="342" fill="#94a3b8">落盘</text>
  </g>

  <!-- ① 对象存储底座 -->
  <rect x="44" y="374" width="540" height="98" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="58" y="400" font-size="13" font-weight="700" fill="#1e293b">① 对象存储底座（S3 / OSS）</text>
  <text x="58" y="422" font-size="11.5" fill="#334155">内容寻址 CAS（同内容同 key）· 不可变 · 多副本/纠删</text>
  <text x="58" y="442" font-size="11.5" fill="#334155">_cas 跨版本共享未变块 · 原始包 Raw 留存</text>
  <text x="58" y="462" font-size="11.5" fill="#64748b">分区：数据集 / 版本 / split（split 是物理分区，也是权限边界）</text>

  <!-- ========== 元数据面 ========== -->
  <rect x="620" y="82" width="312" height="406" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="636" y="104" font-size="13" font-weight="700" fill="#6b21a8">元数据面（独立存储 · 不随数据迁冷）</text>

  <rect x="636" y="116" width="280" height="80" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="650" y="139" font-size="12.5" font-weight="700" fill="#6b21a8">数据目录 / 检索</text>
  <text x="650" y="159" font-size="11" fill="#64748b">Catalog 登记 · 多维检索</text>
  <text x="650" y="177" font-size="11" fill="#64748b">数据发现 · 浏览画像</text>

  <rect x="636" y="204" width="280" height="80" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="650" y="227" font-size="12.5" font-weight="700" fill="#6b21a8">元数据库（关系库）</text>
  <text x="650" y="247" font-size="11" fill="#64748b">数据集/版本/样本登记</text>
  <text x="650" y="265" font-size="11" fill="#64748b">schema · 状态 · 标签</text>

  <rect x="636" y="292" width="280" height="80" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="650" y="315" font-size="12.5" font-weight="700" fill="#6b21a8">血缘图（图库）</text>
  <text x="650" y="335" font-size="11" fill="#64748b">produced_by / derived</text>
  <text x="650" y="353" font-size="11" fill="#64748b">consumed_by 回写</text>

  <rect x="636" y="380" width="280" height="92" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="650" y="403" font-size="12.5" font-weight="700" fill="#6b21a8">向量索引（向量库）</text>
  <text x="650" y="423" font-size="11" fill="#64748b">找相似 · 去重佐证</text>
  <text x="650" y="441" font-size="11" fill="#64748b">素材挖掘 · badcase 检索</text>
  <text x="650" y="459" font-size="11" fill="#94a3b8">与条件检索互补</text>

  <!-- 关联箭头 -->
  <line x1="600" y1="203" x2="634" y2="203" stroke="#9333ea" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arBlue)"/>
  <line x1="634" y1="332" x2="600" y2="332" stroke="#9333ea" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arBlue)"/>
  <line x1="600" y1="426" x2="634" y2="426" stroke="#9333ea" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arBlue)"/>
  <text x="617" y="498" font-size="10.5" fill="#7c3aed" text-anchor="middle">内容指纹 hash 关联</text>
  <text x="314" y="502" font-size="11" fill="#64748b" text-anchor="middle">数据可迁冷 / 删除，元数据与血缘不删——审计链不断</text>
</svg>
