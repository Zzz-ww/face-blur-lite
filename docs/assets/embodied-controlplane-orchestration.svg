<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="wG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="wO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/></marker>
    <marker id="wR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a14e50"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" rx="14" fill="#f8fafc"/>
  <text x="28" y="38" font-size="18" font-weight="700" fill="#0f172a">跨作业编排 · PipelineRun 触发链（示意）</text>
  <text x="28" y="60" font-size="12.5" fill="#64748b">四类触发 → PipelineRun（作业间 DAG）→ 跨域编排链（补采→生产→评测→回流）；与 Argo Workflows 同款 CRD+controller 模式</text>

  <!-- 触发四态 -->
  <rect x="24" y="96" width="200" height="200" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="124" y="122" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">触发源（04 §3 四态）</text>
  <g font-size="10.5">
    <rect x="36" y="134" width="176" height="34" rx="6" fill="#f1f5f9"/><text x="124" y="155" fill="#475569" text-anchor="middle">manual（手动提交）</text>
    <rect x="36" y="174" width="176" height="34" rx="6" fill="#f1f5f9"/><text x="124" y="195" fill="#475569" text-anchor="middle">schedule（cron 周期）</text>
    <rect x="36" y="214" width="176" height="34" rx="6" fill="#f1f5f9"/><text x="124" y="235" fill="#475569" text-anchor="middle">event（外部事件）</text>
    <rect x="36" y="254" width="176" height="34" rx="6" fill="#fee2e2" stroke="#fca5a5"/><text x="124" y="275" font-weight="700" fill="#991b1b" text-anchor="middle">data-arrival（数据到达）</text>
  </g>
  <text x="124" y="296" font-size="9.5" fill="#64748b" text-anchor="middle">接入落湖事件即触发（RawDataPackage）</text>

  <!-- PipelineRun -->
  <rect x="270" y="96" width="300" height="200" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="420" y="122" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="middle">PipelineRun（05 · 作业间 DAG）</text>
  <text x="420" y="148" font-size="10.5" fill="#475569" text-anchor="middle">steps = 引用 PipelineSpec（04）</text>
  <text x="420" y="168" font-size="10.5" fill="#475569" text-anchor="middle">显式依赖 / 条件分支 / 失败策略</text>
  <rect x="286" y="182" width="268" height="40" rx="6" fill="#eff6ff"/>
  <text x="420" y="202" font-size="10.5" fill="#1e3a8a" text-anchor="middle">Argo Workflows 对齐：CRD + controller</text>
  <text x="420" y="218" font-size="9.5" fill="#1e3a8a" text-anchor="middle">每步一个执行单元 · GitOps 交付 · 可重放</text>
  <text x="420" y="258" font-size="10" fill="#64748b" text-anchor="middle">经 02 准入 → 03 状态机推进（作业间编排</text>
  <text x="420" y="274" font-size="10" fill="#64748b" text-anchor="middle">不碰作业内 DAG——那是 04/算子-03 的事）</text>

  <!-- 跨域编排链 -->
  <rect x="616" y="96" width="320" height="44" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="776" y="122" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">接入域 · RawDataPackage 落湖</text>

  <rect x="616" y="150" width="320" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="776" y="176" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">生产域 · 数据批处理（04 spec）</text>

  <rect x="616" y="204" width="320" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="776" y="230" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">消费域 · 下游评测（L4）</text>

  <rect x="616" y="258" width="320" height="44" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="776" y="276" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Badcase 回流（治理裁决）</text>
  <text x="776" y="294" font-size="9.5" fill="#991b1b" text-anchor="middle">→ 补采指令（治理 → 接入，排产优先）</text>

  <!-- 箭头 -->
  <line x1="224" y1="196" x2="268" y2="196" stroke="#2563eb" stroke-width="2" marker-end="url(#wG)"/>
  <line x1="570" y1="150" x2="614" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#wG)"/>
  <line x1="570" y1="180" x2="614" y2="180" stroke="#2563eb" stroke-width="2" marker-end="url(#wG)"/>
  <line x1="570" y1="196" x2="614" y2="240" stroke="#f59e0b" stroke-width="2" marker-end="url(#wO)"/>
  <line x1="776" y1="140" x2="776" y2="148" stroke="#2563eb" stroke-width="2" marker-end="url(#wG)"/>
  <line x1="776" y1="194" x2="776" y2="202" stroke="#16a34a" stroke-width="2" marker-end="url(#wG)"/>
  <line x1="776" y1="248" x2="776" y2="256" stroke="#a14e50" stroke-width="2" marker-end="url(#wR)"/>
  <line x1="700" y1="302" x2="300" y2="298" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#wG)"/>
  <text x="500" y="292" font-size="9" fill="#64748b">补采指令回接入域（排产优先 · 治理裁决）</text>
</svg>
